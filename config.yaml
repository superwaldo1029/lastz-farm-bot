# ---------------------------------------------------------------------------
# Last Z farm helper - configuration
# Every template name is a PNG in templates/ (without the .png).
# Screen layout: 1080x1920 portrait. Keep BlueStacks at this resolution.
# ---------------------------------------------------------------------------

adb_path: adb
templates_dir: templates
match_threshold: 0.85         # default for every template

# Per-template overrides
thresholds:
  level_6: 0.93               # strict: "Lv.5" looks a lot like "Lv.6"
  idle_squad: 0.72
  shield_24h_label: 0.95      # the 8h label scores 0.88 against it - keep strict
  shield_use: 0.90            # 'Purchase & Use' (gems) scores 0.36
  shield_inactive: 0.90
  back_arrow: 0.90            # dimmed arrow behind popups scores ~0.79
  collect_exp: 0.80           # all 3 EXP bubbles 0.95+, anything else <0.68
  collect_zent: 0.78          # Z coin bubbles 0.84+, anything else <0.54
  collect_food: 0.82          # food cans 0.90+, anything else <0.72
  collect_fuel: 0.85          # red fuel can 1.00, anything else <0.57
  collect_wood: 0.85          # log bubbles 0.96+, anything else <0.73
  collect_silver: 0.88        # silver coin stacks 0.93+
  explore_chest: 0.92         # chest 1.00; the crossed-swords battle icon in the same spot scores 0.78            # "zZ" scores 0.83-1.00 when idle, <0.6 otherwise

# One entry per BlueStacks instance (one farm account each).
devices:
  - name: farm1
    serial: 127.0.0.1:5555
    max_marches: 2            # one wood + one food
  # - name: farm2
  #   serial: 127.0.0.1:5565
  #   max_marches: 3
  #   resources: [wood, food]          # zent is also captured: add it here to rotate it in
shuffle_resources: false         # strict order: wood, food, wood, food...

# Resource types to rotate through. Each needs templates/resource_<type>.png
# Captured: wood (Lumberyard), food (Farmland), zent (Mining Zone).
resources: [wood, food]          # zent is also captured: add it here to rotate it in
shuffle_resources: false         # strict order: wood, food, wood, food...

# --- Timing (seconds unless noted) -----------------------------------------
default_wait: [0.8, 1.6]
default_timeout: 6
between_marches: [2, 6]
cycle_minutes: [25, 45]

# Weekly windows (local Mac time) with NO gather marches. Routines still run.
no_gather_windows:
  - name: Enemy Buster
    start: Fri 20:30
    end: Sat 21:00
# active_hours: [7, 23]       # runs 24/7; uncomment to give it a sleep window

# --- Safety -------------------------------------------------------------------
free_march_template: idle_squad   # only send a march if a sleeping (idle) squad is showing
home_template: home_map           # "Headquarters" button = we're on the world map
reset_back_presses: 6             # max Android back presses while recovering
reset_taps: [world_button]        # in the city, tap World instead of pressing back
exit_cancel_template: exit_cancel     # "Exit the game?" -> Cancel (never Confirm)
exit_cancel_region: [0.50, 0.53, 0.86, 0.63]   # only look where Cancel sits (right button)
loading_template: loading_logo        # Last Z loading screen: wait, don't press back
loading_wait_seconds: 240
restart_game_if_stuck: true           # force-restart Last Z if recovery can't reach the map
# game_package: com.example.lastz     # auto-detected; set it here only if restarts fail
# no_march_template: no_free_march    # add once captured

# --- The march flow (matches the real screens, wood captured 10/26) -----------
gather_sequence:
  - find: search_button           # magnifying glass, bottom-left of the world map
  - find: resource_{resource}     # carousel tab, e.g. "Lumberyard"
    scroll_if_missing:            # swipe the carousel if the tab is off-screen
      swipe: [0.85, 0.67, 0.15, 0.67]
      tries: 3
    tap_frac_if_missing: [[0.86, 0.69]]   # last resort: tap the half-visible tab at the right edge
  - ensure: level_6               # level resets per resource; force it to 6
    fix:
      - {press: level_minus, times: 6}   # down to Lv.1
      - {press: level_plus,  times: 5}   # back up to Lv.6
  - find: search_go               # blue Search button (level slider remembers your setting)
    wait: [2.0, 3.0]              # map pans so the tile sits at screen center
  - tap_frac: [0.5, 0.497]        # tap the tile to open its popup
    wait: [1.0, 1.8]
  - find: gather_button
    timeout: 8
  - find: march_button            # deploy panel, first idle squad preselected
    wait: [1.5, 2.5]

# --- Timed routines (run after the gather marches when due) -------------------
routines:
  donate_tech:
    every_minutes: [100, 130]
    retry_minutes: 20
    steps:
      - find: alliance_button       # shield, bottom-right of world map
      - find: alliance_techs
        wait: [1.5, 2.2]
      - find: tech_thumbs           # leader's recommended tech (thumbs-up badge)
        offset: [85, 75]            # tap the tech icon, not the badge
        tap_if_missing: [tab_combat, tab_dominator]
      - find: donate_zent           # BLUE zent button only, never the gem one
        region: [0.50, 0.68, 0.86, 0.78]
        repeat: 20                  # tap until attempts run out (max 20)
        repeat_wait: [0.6, 1.2]
      - find: popup_close
      - find: back_arrow            # tech tree -> alliance
      - find: back_arrow            # alliance -> world map

  collect_hq:                     # city bubbles: EXP, fuel, zent, silver, food, wood. Electricity is never collected.
    every_minutes: [60, 100]
    retry_minutes: 20
    steps:
      # --- area 1: around HQ (camera always centers on HQ when entering the city)
      - find: home_map            # "Headquarters" -> city
        wait: [2.0, 3.0]
      - find: collect_exp         # green EXP bubbles
        optional: true
        repeat: 5
        repeat_wait: [1.4, 2.0]
        timeout: 3
      - find: collect_fuel        # red fuel (gas) can
        optional: true
        repeat: 2
        repeat_wait: [1.4, 2.0]
        timeout: 2
      - find: collect_zent        # gold Z coin bubbles
        optional: true
        repeat: 8
        repeat_wait: [1.4, 2.0]
        timeout: 2
      # --- area 2: blue-roof buildings to the right of HQ
      - drag: [0.75, 0.55, 0.25, 0.55]
      - find: collect_silver      # silver coin-stack bubbles
        optional: true
        repeat: 8
        repeat_wait: [1.4, 2.0]
        timeout: 2
      # --- re-center on HQ: World -> Headquarters
      - find: world_button
        back_if_missing: 4
        wait: [2.0, 3.0]
      - find: home_map
        wait: [2.0, 3.0]
      # --- area 3: farms + lumber yards, down-left of HQ
      - drag: [0.15, 0.50, 0.85, 0.52]
      - find: collect_food        # food cans
        optional: true
        repeat: 6
        repeat_wait: [1.4, 2.0]
        timeout: 2
      - find: collect_wood        # log bubbles on the lumber yards
        optional: true
        repeat: 6
        repeat_wait: [1.4, 2.0]
        timeout: 2
      - find: world_button        # back to the world map
        back_if_missing: 4
        wait: [2.0, 3.0]

  collect_explore:                # explorer idle reward (fills every 8 h)
    every_minutes: [480, 540]
    retry_minutes: 20
    steps:
      - find: home_map            # -> city
        wait: [2.0, 3.0]
      - find: explore_chest       # red chest with timer by the road (never the crossed swords)
        optional: true
        timeout: 3
        wait: [1.5, 2.2]
      - find: explore_collect     # green Collect on the Idle Reward popup
        optional: true
        timeout: 3
        wait: [2.0, 3.0]
      - find: explore_congrats    # "Congratulations!" - tap to close
        optional: true
        timeout: 3
      - find: world_button        # back to the world map
        back_if_missing: 4
        wait: [2.0, 3.0]

  recall_troops:                  # Enemy Buster: bring every gathering squad home
    at: ["Fri 20:30"]             # local Mac time; fires within ~40 s of this
    at_window_minutes: 15         # keeps retrying until 20:45 if something goes wrong
    loop_while: squad_gathering   # repeat while any squad in the queue shows the green pickaxe
    loop_region: [0.86, 0.45, 1.00, 0.72]
    max_loops: 4
    steps:
      - find: squad_gathering     # tap the gathering squad's avatar in the queue
        region: [0.86, 0.45, 1.00, 0.72]
        offset: [30, 28]          # badge -> avatar centre
        wait: [2.0, 3.0]          # map jumps to the squad's tile
      - find: map_gather_marker   # green pickaxe above the tile
        skip_if: recall_return    # the game sometimes opens the Return popup straight away
        optional: true
        region: [0.00, 0.15, 0.85, 0.90]
        wait: [1.2, 1.8]
      - tap_frac: [0.5, 0.49]     # fallback: the squad's tile sits at screen centre (marker can be hidden)
        skip_if: recall_return
        wait: [1.5, 2.2]
      - find: recall_return       # "Return" - no confirm, no cost
        timeout: 5
        wait: [1.5, 2.5]

  shield_24h:                     # Enemy Buster: 24h Peace Shield, Fri 21:00 sharp
    at: ["Fri 21:00"]
    at_window_minutes: 15
    steps:
      - find: home_map            # into the city...
        wait: [2.0, 3.0]
      - find: world_button        # ...and back out: the map is now centred on your base
        wait: [2.5, 3.5]
      - tap_frac: [0.5, 0.525]    # tap your base -> ring menu
        wait: [1.2, 1.8]
      - find: base_buff           # "Buff"
        wait: [1.5, 2.2]
      - find: peace_shield_row    # Formation -> Peace Shield
        wait: [1.5, 2.2]
      - ensure: shield_inactive   # STOP if a shield is already up (never stack/waste one)
      - ensure: shield_24h_label  # STOP unless the 24h row is where we expect it
      - find: shield_use          # blue "Use" in the 24h row ONLY (gem purchase never matches)
        region: [0.63, 0.66, 0.86, 0.73]
        wait: [2.0, 3.0]

